const TRACKS = {
  A:{name:"🏗️ Harness Engineering",color:"var(--track-a)"},
  B:{name:"🧠 Agent Architecture",color:"var(--track-b)"},
  C:{name:"💾 Context & Memory",color:"var(--track-c)"},
  D:{name:"🤝 Multi-Agent",color:"var(--track-d)"},
  E:{name:"💻 AI Coding Agent",color:"var(--track-e)"},
  F:{name:"📏 Evaluation",color:"var(--track-f)"},
  G:{name:"🏗️ Harness 进阶",color:"var(--track-g)"},
  H:{name:"🧠 架构进阶",color:"var(--track-h)"},
  I:{name:"💾 Context 进阶",color:"var(--track-i)"},
  J:{name:"🤝 Multi-Agent 进阶",color:"var(--track-j)"},
  K:{name:"💻 AI Coding 进阶",color:"var(--track-k)"},
  L:{name:"🔧 工具与基础设施",color:"var(--track-l)"}
};

const KEY = 'agent-reading-progress';
let done = JSON.parse(localStorage.getItem(KEY) || '{}');
let currentTier = 'all';
let currentTrack = 'all';
let currentView = 'grid';
let searchQuery = '';

function save() { localStorage.setItem(KEY, JSON.stringify(done)); }

function getArticleUrl(file) {
  // docs/ch05/112-harness-engineering-ai.md → /ch05/112-harness-engineering-ai.html
  return 'https://jinguo.tech/' + file.replace('docs/', '').replace('.md', '.html');
}

function toggleDone(id) {
  if (done[id]) delete done[id]; else done[id] = 1;
  save(); render();
}

function render() {
  // Stats
  const doneIds = Object.keys(done);
  const t1Done = doneIds.filter(id => ARTICLES.find(a=>a.id===id)?.tier===1).length;
  const t2Done = doneIds.filter(id => ARTICLES.find(a=>a.id===id)?.tier===2).length;
  const totalWords = doneIds.reduce((s,id) => s + (ARTICLES.find(a=>a.id===id)?.words||0), 0);
  document.getElementById('s-t1').textContent = t1Done + '/20';
  document.getElementById('s-t2').textContent = t2Done + '/30';
  document.getElementById('s-total').textContent = doneIds.length + '/50';
  document.getElementById('s-time').textContent = (totalWords / 250 / 60).toFixed(1) + 'h';
  document.getElementById('s-words').textContent = (totalWords/1000).toFixed(1) + 'k';
  
  // Main progress
  const pct = Math.round(doneIds.length / 50 * 100);
  document.getElementById('main-progress').style.width = pct + '%';
  document.getElementById('progress-text').textContent = doneIds.length + ' / 50 篇完成';
  document.getElementById('progress-pct').textContent = pct + '%';
  
  // Track progress
  const trackDiv = document.getElementById('track-progress');
  trackDiv.innerHTML = '';
  for (const [k, t] of Object.entries(TRACKS)) {
    const total = ARTICLES.filter(a => a.track === k).length;
    const completed = ARTICLES.filter(a => a.track === k && done[a.id]).length;
    const pct = total ? Math.round(completed/total*100) : 0;
    trackDiv.innerHTML += `<div class="track-bar"><span class="track-name">${t.name}</span><div class="bar"><div class="bar-fill" style="width:${pct}%;background:${t.color}"></div></div><span class="track-count">${completed}/${total}</span></div>`;
  }
  
  // Filter
  const filtered = ARTICLES.filter(a => {
    if (currentTier !== 'all' && a.tier != currentTier) return false;
    if (currentTrack !== 'all' && a.track !== currentTrack) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      return a.title.toLowerCase().includes(q) || a.desc.toLowerCase().includes(q) || a.id.toLowerCase().includes(q) || TRACKS[a.track].name.toLowerCase().includes(q);
    }
    return true;
  });
  
  // Render cards
  const content = document.getElementById('content');
  content.innerHTML = '';
  
  if (filtered.length === 0) {
    content.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>没有找到匹配的文章</p></div>';
    return;
  }
  
  // Group by tier
  const groups = {};
  filtered.forEach(a => {
    const key = 'tier-' + a.tier;
    if (!groups[key]) groups[key] = [];
    groups[key].push(a);
  });
  
  const tierNames = {1:'⭐ Tier 1：核心冲刺',2:'⭐⭐ Tier 2：深入子域',3:'⭐⭐⭐ Tier 3：扩展阅读'};
  
  for (const [key, articles] of Object.entries(groups)) {
    const tier = parseInt(key.split('-')[1]);
    const section = document.createElement('div');
    section.innerHTML = `<div class="section-header"><h2>${tierNames[tier]}</h2><span class="badge">${articles.filter(a=>done[a.id]).length}/${articles.length} 完成</span></div><div class="grid ${currentView==='list'?'list-view':''}" id="grid-${key}"></div>`;
    content.appendChild(section);
    
    const grid = section.querySelector('.grid');
    articles.forEach(a => {
      const isDone = done[a.id];
      const url = getArticleUrl(a.file);
      const card = document.createElement('div');
      card.className = `card fade-in ${isDone?'done':''}`;
      card.innerHTML = `
        <div class="card-top">
          <span class="card-id" style="background:${TRACKS[a.track].color}">${a.id}</span>
          <div class="card-meta">
            <span class="card-tier tier-${a.tier}">Tier ${a.tier}</span>
          </div>
        </div>
        <div class="card-title"><a href="${url}" target="_blank">${a.title}</a><span class="link-icon">↗</span></div>
        <div class="card-desc">${a.desc}</div>
        <div class="card-footer">
          <div class="card-stats">
            <span>📝 ${(a.words/1000).toFixed(1)}k字</span>
            <span>⏱️ ${Math.max(3,Math.round(a.words/250))}min</span>
            <span>${TRACKS[a.track].name}</span>
          </div>
          <button class="check-btn ${isDone?'checked':''}" onclick="event.stopPropagation();toggleDone('${a.id}')">✓</button>
        </div>`;
      card.addEventListener('click', (e) => { if (e.target.tagName !== 'A' && e.target.tagName !== 'BUTTON') window.open(url, '_blank'); });
      grid.appendChild(card);
    });
  }
}

// Tier tabs
document.getElementById('tier-tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('#tier-tabs .tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentTier = tab.dataset.tier;
  render();
});

// Track tabs
const trackTabsDiv = document.getElementById('track-tabs');
const allTab = document.createElement('div');
allTab.className = 'tab active'; allTab.dataset.track = 'all'; allTab.textContent = '全部轨道';
trackTabsDiv.appendChild(allTab);
for (const [k, t] of Object.entries(TRACKS)) {
  const tab = document.createElement('div');
  tab.className = 'tab'; tab.dataset.track = k;
  tab.textContent = t.name.split(' ')[0] + ' ' + t.name.split(' ').slice(1).join(' ');
  tab.style.cssText = `--tc:${t.color}`;
  trackTabsDiv.appendChild(tab);
}
trackTabsDiv.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('#track-tabs .tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentTrack = tab.dataset.track;
  tab.style.borderColor = currentTrack !== 'all' ? TRACKS[currentTrack]?.color : '';
  tab.style.background = currentTrack !== 'all' ? TRACKS[currentTrack]?.color : '';
  tab.style.color = currentTrack !== 'all' ? 'white' : '';
  render();
});

// Search
document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value;
  render();
});

// View toggle
document.querySelectorAll('.view-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentView = btn.dataset.view;
    render();
  });
});

// Reset
document.getElementById('reset-btn').addEventListener('click', () => {
  if (confirm('确定要重置所有阅读进度吗？')) {
    done = {}; save(); render();
  }
});

// Init
render();
</script>
</body>
</html>
