{% extends "base.html" %}
{% block site_meta %}
{{ super() }}
<base href="/">
<meta property="og:image" content="https://jinguo.tech/assets/images/ai-engineering-cover.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="《AI 工程》电子书封面：从 LLM 原理到生产级 Agent">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://jinguo.tech/assets/images/ai-engineering-cover.png">
{% endblock %}
{% block styles %}
{{ super() }}
<link rel="stylesheet" href="{{ 'assets/stylesheets/ai-chat.css' | url }}">
<link rel="stylesheet" href="{{ 'assets/stylesheets/book-cover.css' | url }}">
<link rel="stylesheet" href="{{ 'assets/stylesheets/theme.css' | url }}">
{% endblock %}
{% block scripts %}
{{ super() }}
<script src="{{ 'assets/javascripts/prev-next.js' | url }}"></script>
<script src="{{ 'assets/javascripts/rag-client.js' | url }}"></script>
<script src="{{ 'assets/javascripts/ai-chat.js' | url }}"></script>
<script src="{{ 'assets/javascripts/diagram-overlay.js' | url }}"></script>
<script src="{{ 'assets/javascripts/book-cover.js' | url }}"></script>
<script>
document$.subscribe(function() {
  if (typeof mermaid === 'undefined') return;
  mermaid.initialize({startOnLoad: false, theme: 'default', securityLevel: 'loose'});

  // Collect mermaid source code BEFORE replacing any DOM
  var items = [];
  document.querySelectorAll('pre.mermaid code').forEach(function(code, i) {
    items.push({ idx: i, src: code.textContent, parent: code.closest('pre.mermaid') });
  });
  document.querySelectorAll('div.mermaid').forEach(function(div, i) {
    var t = div.textContent.trim();
    if (t && !div.querySelector('svg')) items.push({ idx: items.length, src: t, parent: div });
  });
  if (!items.length) return;

  // Replace parents with placeholder divs, then render async
  items.forEach(function(item) {
    var ph = document.createElement('div');
    ph.className = 'mermaid';
    ph.id = 'mermaid-ph-' + item.idx;
    ph.setAttribute('data-mermaid-src', item.src);
    if (item.parent) item.parent.replaceWith(ph);
  });

  // Render each diagram
  items.forEach(function(item) {
    var ph = document.getElementById('mermaid-ph-' + item.idx);
    if (!ph) return;
    mermaid.render('mermaid-svg-' + item.idx, item.src).then(function(r) {
      ph.innerHTML = r.svg;
    }).catch(function(e) {
      ph.textContent = item.src;
      console.warn('[Mermaid] render error for #' + item.idx + ':', e.message || e);
    });
  });
});
</script>
{% endblock %}
