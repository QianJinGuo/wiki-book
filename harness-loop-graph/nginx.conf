# nginx config for the bilingual book "Agent Engineering: Harness, Loop, Graph"
# Chinese edition at /, English edition under /en/ (book sites use
# use_directory_urls: true, so pages are directories with index.html and all
# internal links are relative — subpath mounting works without rebuilds).

server {
    listen 8080;
    server_name _;

    # Chinese edition at root
    root /usr/share/nginx/html/zh;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Long cache for static assets (zh root; /en/ is handled by ^~ below)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # English edition under /en/ — ^~ so the asset regex above never
    # steals /en/ paths (which would 404 against the zh root)
    location = /en {
        return 301 /en/;
    }

    location ^~ /en/ {
        alias /usr/share/nginx/html/en/;
        index index.html;
        error_page 404 /en/404.html;
    }

    # zh 404 page (generated by mkdocs-material)
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
