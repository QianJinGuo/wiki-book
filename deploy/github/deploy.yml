name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build curated course data
        run: python3 scripts/build-course.py

      # Wiki-sync re-adds duplicated chapter-prefix H2 titles to entity
      # pages; strip them before building (idempotent).
      - name: Dedupe entity page titles
        run: python3 scripts/dedupe-entity-titles.py --apply

      - name: Build site
        run: mkdocs build

      # ORDER MATTERS: slim first, then build the neighbor graph from the
      # slimmed index so graph indices align with the docs array the
      # browser fetches (same ordering as scripts/build.sh).
      - name: Slim search index
        run: python3 scripts/slim-search-index.py

      - name: Build neighbor graph (Tier 1 RAG)
        run: >
          python3 scripts/build-neighbor-graph.py
          --input site/search/search_index.json
          --output site/assets/neighbor_graph.json
          --top-k 20

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
