<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>📚 AI 工程 · 渐进式学习仪表盘</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/images/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="48x48" href="../assets/images/favicon-48x48.png">
<link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
<link rel="apple-touch-icon" href="../assets/images/favicon.png">
<style>
:root{--bg:#0a0e1a;--surface:#111827;--surface2:#1e293b;--surface3:#283548;
--border:#334155;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
--accent:#8b5cf6;--accent2:#a78bfa;--green:#22c55e;--yellow:#eab308;
--orange:#f97316;--red:#ef4444;--cyan:#06b6d4;--pink:#ec4899;--blue:#3b82f6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'SF Pro','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}

.header{background:linear-gradient(135deg,#1e1b4b 0%,#0f172a 60%,#0a0e1a 100%);border-bottom:1px solid var(--border);padding:2rem 1rem 1.5rem}
.header-inner{max-width:1400px;margin:0 auto;position:relative}
.header h1{font-size:1.8rem;background:linear-gradient(135deg,#818cf8,#c084fc,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.4rem}
.header p{color:var(--text2);font-size:.9rem}

.countdown{position:absolute;top:0;right:0;background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.3);border-radius:12px;padding:.5rem 1rem;cursor:pointer;transition:all .25s;user-select:none}
.countdown:hover{background:rgba(139,92,246,.2);border-color:rgba(139,92,246,.5);transform:translateY(-1px)}
.countdown-label{font-size:.72rem;color:var(--text3);margin-bottom:.15rem}
.countdown-days{font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,#f97316,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2}
.countdown-days.urgent{background:linear-gradient(135deg,#ef4444,#dc2626);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:pulse-urgent 2s infinite}
.countdown-days.passed{background:linear-gradient(135deg,var(--text3),var(--text2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.countdown-unit{font-size:.8rem;font-weight:400;color:var(--text2);margin-left:.15rem}
@keyframes pulse-urgent{0%,100%{opacity:1}50%{opacity:.6}}
@media(max-width:768px){.countdown{position:static;margin-top:.8rem;display:inline-block}}

.phase-bar{display:flex;gap:.3rem;margin:1.2rem 0 .5rem;flex-wrap:wrap}
.phase-chip{padding:.4rem 1rem;border-radius:10px;font-size:.82rem;font-weight:600;cursor:pointer;border:2px solid transparent;transition:all .2s;opacity:.6}
.phase-chip:hover{opacity:.85}
.phase-chip.active{opacity:1;border-color:#fff;transform:scale(1.05)}
.phase-chip .count{font-size:.7rem;opacity:.7;margin-left:.3rem}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.8rem;margin-bottom:1rem}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.8rem;text-align:center}
.stat .num{font-size:1.6rem;font-weight:700}
.stat .label{color:var(--text2);font-size:.72rem;margin-top:.15rem}

.controls{max-width:1400px;margin:0 auto 1rem;display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;padding:0 1rem}
.search-box{flex:1;min-width:180px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.6rem 1rem;color:var(--text);font-size:.9rem;outline:none}
.search-box:focus{border-color:var(--accent)}
.search-box::placeholder{color:var(--text3)}
.chip-group{display:flex;gap:.3rem;flex-wrap:wrap}
.chip{padding:.35rem .8rem;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;font-size:.78rem;transition:all .2s;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}

.sync-bar{max-width:1400px;margin:0 auto .8rem;padding:0 1rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.sync-status{font-size:.78rem;color:var(--text3)}
.sync-status.ok{color:var(--green)}
.sync-status.err{color:var(--red)}
.sync-input{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.35rem .7rem;color:var(--text);font-size:.82rem;width:160px;outline:none}
.sync-input:focus{border-color:var(--accent)}
.sync-btn{padding:.35rem .8rem;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;font-size:.78rem;transition:all .2s}
.sync-btn:hover{border-color:var(--accent);color:var(--text)}

.progress-section{max-width:1400px;margin:0 auto .8rem;padding:0 1rem}
.progress-bars{display:grid;gap:.4rem}
.phase-progress{display:flex;align-items:center;gap:.5rem;padding:.3rem 0}
.phase-progress .pname{font-size:.75rem;font-weight:600;min-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phase-progress .bar{flex:1;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.phase-progress .bar-fill{height:100%;border-radius:4px;transition:width .5s}
.phase-progress .pcount{font-size:.72rem;color:var(--text3);min-width:80px;text-align:right}

.content{max-width:1400px;margin:0 auto;padding:0 1rem 3rem}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:.8rem}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem;transition:all .2s;cursor:pointer;position:relative}
.card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 6px 20px rgba(99,102,241,.08)}
.card.done{opacity:.55}
.card.done .card-title{text-decoration:line-through}

.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem}
.phase-badge{font-size:.68rem;font-weight:700;padding:.15rem .5rem;border-radius:5px;color:#fff}
.level-badge{font-size:.68rem;padding:.15rem .4rem;border-radius:4px}
.lv1{background:rgba(245,158,11,.12);color:var(--yellow)}
.lv2{background:rgba(99,102,241,.12);color:var(--accent2)}
.lv3{background:rgba(34,197,94,.12);color:var(--green)}

.card-title{font-size:.92rem;font-weight:600;margin-bottom:.3rem;line-height:1.4}
.card-title a{color:inherit;text-decoration:none}
.card-title a:hover{text-decoration:underline}
.card-meta{display:flex;justify-content:space-between;align-items:center;margin-top:.5rem}
.card-chapter{font-size:.72rem;color:var(--text3)}
.card-words{font-size:.72rem;color:var(--text3)}
.card-actions{display:flex;gap:.3rem;align-items:center}

.level-btn{padding:.2rem .5rem;border-radius:5px;border:1px solid var(--border);background:var(--surface2);color:var(--text3);cursor:pointer;font-size:.72rem;transition:all .15s;white-space:nowrap}
.level-btn:hover{border-color:var(--accent)}
.level-btn.read{background:rgba(6,182,212,.15);color:var(--cyan);border-color:var(--cyan)}
.level-btn.explained{background:rgba(234,179,8,.15);color:var(--yellow);border-color:var(--yellow)}
.level-btn.taught{background:rgba(249,115,22,.15);color:var(--orange);border-color:var(--orange)}
.level-btn.mastered{background:rgba(34,197,94,.15);color:var(--green);border-color:var(--green)}

.loading{text-align:center;padding:4rem;color:var(--text2)}
.empty{text-align:center;padding:3rem;color:var(--text3)}

.section-header{margin:1.5rem 0 .8rem;display:flex;align-items:center;gap:.6rem}
.section-header h2{font-size:1rem}
.section-header .badge{background:var(--surface2);color:var(--text2);padding:.15rem .5rem;border-radius:5px;font-size:.72rem}


.recall-section{max-width:1400px;margin:0 auto .8rem;padding:0 1rem}
.recall-header{display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem;cursor:pointer;user-select:none}
.recall-header h2{font-size:1rem;color:var(--pink)}
.recall-header .badge{background:rgba(236,72,153,.15);color:var(--pink);padding:.15rem .5rem;border-radius:5px;font-size:.72rem}
.recall-toggle{font-size:.78rem;color:var(--text3);margin-left:auto}
.recall-panel{display:none}
.recall-panel.open{display:block}
.recall-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:.6rem;margin-bottom:.6rem}
.recall-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.8rem;display:flex;flex-direction:column;gap:.4rem}
.recall-card:hover{border-color:var(--pink)}
.recall-card-title{font-size:.85rem;font-weight:600;line-height:1.3}
.recall-card-title a{color:inherit;text-decoration:none}
.recall-card-title a:hover{text-decoration:underline}
.recall-card-meta{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;color:var(--text3)}
.recall-card-meta .interval{color:var(--yellow)}
.recall-card-meta .due{color:var(--red)}
.recall-actions{display:flex;gap:.4rem}
.recall-btn{padding:.3rem .7rem;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;font-size:.75rem;transition:all .15s;flex:1;text-align:center}
.recall-btn:hover{border-color:var(--accent);color:var(--text)}
.recall-btn.remembered{background:rgba(34,197,94,.15);color:var(--green);border-color:var(--green)}
.recall-btn.forgot{background:rgba(239,68,68,.15);color:var(--red);border-color:var(--red)}
.recall-stats{display:flex;gap:1rem;font-size:.78rem;color:var(--text2);margin-bottom:.6rem;flex-wrap:wrap}
.recall-stats span{display:flex;align-items:center;gap:.3rem}
.recall-empty{text-align:center;padding:1.5rem;color:var(--text3);font-size:.85rem}

.daily-section{max-width:1400px;margin:0 auto .8rem;padding:0 1rem}
.daily-card{background:linear-gradient(135deg,#1e1b4b 0%,#0f172a 100%);border:1px solid var(--border);border-radius:14px;padding:1.2rem 1.5rem;display:flex;gap:1rem;align-items:flex-start;position:relative;overflow:hidden}
.daily-card::before{content:'';position:absolute;top:-40px;right:-40px;width:120px;height:120px;background:radial-gradient(circle,rgba(139,92,246,.12) 0%,transparent 70%);pointer-events:none}
.daily-icon{font-size:2rem;flex-shrink:0;line-height:1}
.daily-body{flex:1;min-width:0}
.daily-label{font-size:.72rem;color:var(--accent2);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.3rem}
.daily-title{font-size:1.1rem;font-weight:700;line-height:1.4;margin-bottom:.4rem}
.daily-title a{color:inherit;text-decoration:none}
.daily-title a:hover{text-decoration:underline}
.daily-meta{display:flex;gap:.8rem;font-size:.75rem;color:var(--text3);margin-bottom:.6rem;flex-wrap:wrap}
.daily-meta .phase-tag{padding:.1rem .4rem;border-radius:4px;font-weight:600;font-size:.68rem;color:#fff}
.daily-actions{display:flex;gap:.4rem;align-items:center}
.daily-read-btn{padding:.4rem 1rem;border-radius:8px;background:var(--accent);color:#fff;font-size:.82rem;font-weight:600;cursor:pointer;border:none;transition:all .15s;text-decoration:none;display:inline-flex;align-items:center;gap:.3rem}
.daily-read-btn:hover{background:var(--accent2);transform:translateY(-1px)}
.daily-skip-btn{padding:.4rem .8rem;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:.78rem;cursor:pointer;transition:all .15s}
.daily-skip-btn:hover{border-color:var(--accent);color:var(--text)}
.daily-date{font-size:.72rem;color:var(--text3);margin-left:auto}

.feynman-badge{font-size:.68rem;padding:.1rem .35rem;border-radius:4px;background:rgba(139,92,246,.12);color:var(--accent);margin-left:.3rem;cursor:pointer}
.feynman-badge:hover{background:rgba(139,92,246,.25)}
.feynman-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:1000}
.feynman-modal.open{display:flex}
.feynman-review-info{font-size:.72rem;color:var(--text3);margin-left:auto;margin-right:.5rem;text-align:right}
.feynman-review-info .count{color:var(--accent)}
.feynman-review-info .age{color:var(--yellow)}
.feynman-review-info .old{color:var(--orange)}
.feynman-panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;max-width:600px;width:90%;max-height:85vh;overflow-y:auto;padding:1.5rem}
.feynman-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.feynman-header h3{font-size:1.1rem;background:linear-gradient(135deg,#818cf8,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.feynman-close{background:none;border:none;color:var(--text3);font-size:1.5rem;cursor:pointer;line-height:1}
.feynman-close:hover{color:var(--text)}
.feynman-field{margin-bottom:.8rem}
.feynman-field label{display:block;font-size:.78rem;color:var(--text2);margin-bottom:.25rem;font-weight:600}
.feynman-field textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.6rem;color:var(--text);font-size:.85rem;resize:vertical;min-height:60px;font-family:inherit}
.feynman-field textarea:focus{outline:none;border-color:var(--accent)}
.feynman-field textarea::placeholder{color:var(--text3)}
.feynman-level-row{display:flex;gap:.5rem;margin-bottom:.8rem;flex-wrap:wrap}
.feynman-level-btn{padding:.35rem .8rem;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;font-size:.8rem;transition:all .15s}
.feynman-level-btn:hover{border-color:var(--accent);color:var(--text)}
.feynman-level-btn.active{border-color:var(--accent);background:var(--accent);color:#fff}
.feynman-level-btn.read.active{background:rgba(6,182,212,.2);border-color:var(--cyan);color:var(--cyan)}
.feynman-level-btn.explained.active{background:rgba(234,179,8,.2);border-color:var(--yellow);color:var(--yellow)}
.feynman-level-btn.taught.active{background:rgba(249,115,22,.2);border-color:var(--orange);color:var(--orange)}
.feynman-level-btn.mastered.active{background:rgba(34,197,94,.2);border-color:var(--green);color:var(--green)}
.feynman-actions{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem}
.feynman-save{padding:.5rem 1.2rem;border-radius:8px;background:var(--accent);color:#fff;font-size:.85rem;font-weight:600;cursor:pointer;border:none}
.feynman-save:hover{background:var(--accent2)}
.feynman-cancel{padding:.5rem 1rem;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:.85rem;cursor:pointer}
.feynman-cancel:hover{border-color:var(--accent);color:var(--text)}
.feynman-summary{font-size:.72rem;color:var(--text3);margin-top:.3rem;line-height:1.4}
.threads-list{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.4rem}
.thread-item{display:flex;gap:.4rem;align-items:center;background:var(--surface2);border-radius:6px;padding:.3rem .5rem}
.thread-item a{color:var(--blue);font-size:.78rem;text-decoration:none;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thread-item a:hover{text-decoration:underline}
.thread-item .thread-name{color:var(--text);font-size:.78rem;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis}
.thread-remove{color:var(--text3);cursor:pointer;font-size:.9rem;line-height:1}
.thread-remove:hover{color:var(--red)}
.thread-add-row{display:flex;gap:.3rem;align-items:center}
.feynman-upgrade-hint{font-size:.75rem;color:var(--text3);margin-top:.3rem;padding:.4rem .6rem;background:rgba(245,158,11,.08);border-radius:6px;display:none}
.feynman-upgrade-hint.show{display:block}
.feynman-upgrade-hint .arrow{color:var(--green)}
.thread-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:.3rem .5rem;color:var(--text);font-size:.78rem}
.thread-input:focus{outline:none;border-color:var(--accent)}
.thread-url{flex:2}
.thread-add-btn{padding:.3rem .6rem;border-radius:6px;background:var(--surface2);color:var(--accent);border:1px solid var(--border);font-size:.78rem;cursor:pointer}
.thread-add-btn:hover{background:var(--accent);color:#fff}
.feynman-tooltip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.5rem .7rem;font-size:.72rem;color:var(--text);width:280px;max-height:150px;overflow-y:auto;display:none;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.3)}

@media(max-width:640px){
  .header h1{font-size:1.3rem}
  .grid{grid-template-columns:1fr}
  .phase-bar{gap:.2rem}
  .phase-chip{padding:.3rem .6rem;font-size:.72rem}
  .stats{grid-template-columns:repeat(3,1fr)}
  .recall-list{grid-template-columns:1fr}
  .daily-card{flex-direction:column}
  .daily-icon{font-size:1.5rem}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <h1>📚 AI 工程 · 渐进式学习仪表盘</h1>
    <p id="header-sub">加载中...</p>
    <div class="countdown" id="countdown" onclick="openCountdownEditor()" title="点击编辑倒计时">
      <div class="countdown-label" id="countdown-label">距离面试还有</div>
      <div><span class="countdown-days" id="countdown-days">--</span><span class="countdown-unit">天</span></div>
    </div>
    <div class="phase-bar" id="phase-bar"></div>
  </div>
</div>

<div class="stats" id="stats-row" style="max-width:1400px;margin:1rem auto;padding:0 1rem"></div>

<div class="sync-bar">
  <span style="font-size:.82rem;color:var(--text2)">👤 用户 ID：</span>
  <input class="sync-input" id="user-id" placeholder="输入用户名同步进度" />
  <button class="sync-btn" id="sync-push">⬆ 推送</button>
  <button class="sync-btn" id="sync-pull">⬇ 拉取</button>
  <span class="sync-status" id="sync-status">离线模式（仅本地）</span>
</div>

<div class="controls">
  <input class="search-box" id="search" placeholder="搜索标题、章节..." />
  <div class="chip-group" id="chapter-filters"></div>
  <div class="chip-group" id="level-filters"></div>
</div>

<div class="progress-section">
  <div class="progress-bars" id="progress-bars"></div>
</div>



<div class="daily-section" id="daily-section">
  <div class="daily-card" id="daily-card">
    <div class="daily-icon">📅</div>
    <div class="daily-body">
      <div class="daily-label">每日一读</div>
      <div class="daily-title" id="daily-title"></div>
      <div class="daily-meta" id="daily-meta"></div>
      <div class="daily-actions" id="daily-actions"></div>
    </div>
    <div class="daily-date" id="daily-date"></div>
  </div>
</div>
<div class="recall-section" id="recall-section">
  <div class="recall-header" id="recall-header">
    <h2>🧠 艾宾浩斯 Recall</h2>
    <span class="badge" id="recall-count-badge">0 待复习</span>
    <span class="recall-toggle" id="recall-toggle">▶ 展开</span>
  </div>
  <div class="recall-panel" id="recall-panel">
    <div class="recall-stats" id="recall-stats"></div>
    <div class="recall-list" id="recall-list"></div>
  </div>
</div>
<div class="content" id="content">
  <div class="loading">⏳ 正在加载文章数据...</div>
</div>

<script>
const LS_KEY = 'wiki-learn-progress-v3';
const USER_KEY = 'wiki-learn-user';
const RECALL_KEY = 'wiki-learn-recall-v1';
const COUNTDOWN_KEY = 'wiki-learn-countdown-v1';
const RECALL_INTERVALS = [1, 2, 4, 7, 15, 30]; // days - Ebbinghaus
const LEVELS = ['read','explained','taught','mastered'];

let DATA = null;
let done = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
let currentPhase = 0;
let currentChapter = 'all';
let currentLevel = 'all';
let searchQuery = '';
let userId = localStorage.getItem(USER_KEY) || '';
let countdownCfg = JSON.parse(localStorage.getItem(COUNTDOWN_KEY) || 'null') || { label: '面试', targetDate: new Date(Date.now() + 30 * 86400000).toISOString().slice(0, 10) };
let recallData = JSON.parse(localStorage.getItem(RECALL_KEY) || '{}');
let recallPanelOpen = false;

// ── D1 Sync ──────────────────────────────────────────────────
function getApiBase(){ return window.location.origin + '/api/user-data'; }

function setSyncStatus(msg, ok){
  const el = document.getElementById('sync-status');
  el.textContent = msg;
  el.className = 'sync-status' + (ok === true ? ' ok' : ok === false ? ' err' : '');
}

async function pushToCloud(){
  if(!userId){ setSyncStatus('请先输入用户 ID', false); return; }
  setSyncStatus('推送中...', null);
  const progress = Object.entries(done).map(([file, data]) => ({
    file, level: typeof data === 'object' ? data.level : 'read',
    updatedAt: typeof data === 'object' ? data.updatedAt : (typeof data === 'number' ? data : Date.now())
  }));
  const feynmanToSend = {...feynmanData};
  const recallToSend = {...recallData};
  try {
    const resp = await fetch(getApiBase(), {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ user: userId, progress, feynman: feynmanToSend, recall: recallToSend })
    });
    const result = await resp.json();
    if(result.ok) setSyncStatus('✓ 已推送 '+result.count+' 条到云端', true);
    else setSyncStatus('推送失败: '+result.error, false);
  } catch(e) { setSyncStatus('推送失败: '+e.message, false); }
}

async function pullFromCloud(){
  if(!userId){ setSyncStatus('请先输入用户 ID', false); return; }
  setSyncStatus('拉取中...', null);
  try {
    const resp = await fetch(getApiBase() + '?user=' + encodeURIComponent(userId));
    const result = await resp.json();
    if(result.progress){
      const cloud = result.progress;
      let merged = {...done};
      for(const [file,data] of Object.entries(cloud)){
        const ct = data.updatedAt||0;
        const lt = (merged[file]&&typeof merged[file]==='object')?merged[file].updatedAt:(typeof merged[file]==='number'?merged[file]:0);
        if(ct>=lt) merged[file]=data;
      }
      done=merged; save();
    }
    if(result.feynman){
      for(const [file,note] of Object.entries(result.feynman)){
        const ct = note.updatedAt||0;
        const lt = feynmanData[file]?.updatedAt||0;
        if(ct>=lt) feynmanData[file]=note;
      }
      saveFeynmanStorage();
    }
    if(result.recall){
      for(const [file,r] of Object.entries(result.recall)){
        const ct = r.lastReview||r.addedAt||0;
        const lt = recallData[file]?.lastReview||recallData[file]?.addedAt||0;
        if(ct>=lt) recallData[file]=r;
      }
      saveRecall();
    }
    render(); renderRecallPanel();
    const total = Object.keys(result.progress||{}).length + Object.keys(result.feynman||{}).length + Object.keys(result.recall||{}).length;
    setSyncStatus('✓ 已拉取 '+total+' 条从云端', true);
  } catch(e) { setSyncStatus('拉取失败: '+e.message, false); }
}

// Auto-sync on change (debounced)
let syncTimer = null;
function scheduleSync(){
  if(!userId) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => pushToCloud(), 3000);
}

// ── Local Storage ────────────────────────────────────────────
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(done)); }
function saveRecall(){ localStorage.setItem(RECALL_KEY, JSON.stringify(recallData)); }

function getLevel(file){
  const d = done[file];
  if(!d) return null;
  if(typeof d === 'object') return d.level;
  return 'read'; // legacy boolean format
}

function setLevel(file, level){
  if(level === null){
    delete done[file];
    if(recallData[file]) removeFromRecallQueue(file);
  } else {
    done[file] = { level, updatedAt: Date.now() };
    if(!recallData[file]) addToRecallQueue(file);
  }
  save();
  scheduleSync();
  render();
}

function cycleLevel(file){
  const current = getLevel(file);
  if(!current){
    setLevel(file, 'read');
  } else {
    const idx = LEVELS.indexOf(current);
    if(idx >= LEVELS.length - 1){
      setLevel(file, null); // clear
    } else {
      setLevel(file, LEVELS[idx + 1]);
    }
  }
}

function levelLabel(lv){
  return lv === 'read' ? '📖 已读' : lv === 'explained' ? '✍️ 解释' : lv === 'taught' ? '🎓 教授' : lv === 'mastered' ? '🏆 掌握' : '';
}

function articleUrl(file){
  return '/' + file.replace('docs/','').replace('.md','.html');
}

function formatWords(w){
  if(w > 10000) return (w/1000).toFixed(0)+'k';
  if(w > 1000) return (w/1000).toFixed(1)+'k';
  return w;
}

function phaseColor(pid){
  const p = DATA.phases.find(x=>x.id===pid);
  return p ? p.color : '#64748b';
}

function phaseName(pid){
  const p = DATA.phases.find(x=>x.id===pid);
  return p ? p.name : 'Unknown';
}


// ── Recall (Ebbinghaus Forgetting Curve) ─────────────────────
function addToRecallQueue(file){
  if(recallData[file]) return;
  recallData[file] = {
    addedAt: Date.now(),
    nextReview: Date.now() + RECALL_INTERVALS[0] * 86400000,
    step: 0,
    totalReviews: 0,
    successes: 0,
    lastReview: null
  };
  saveRecall();
}
function removeFromRecallQueue(file){
  delete recallData[file];
  saveRecall();
}
function handleRecall(file, remembered){
  const r = recallData[file];
  if(!r) return;
  r.totalReviews++;
  r.lastReview = Date.now();
  if(remembered){
    r.successes++;
    r.step = Math.min(r.step + 1, RECALL_INTERVALS.length - 1);
  } else {
    r.step = 0;
  }
  r.nextReview = Date.now() + RECALL_INTERVALS[r.step] * 86400000;
  saveRecall();
  scheduleSync(); // Sync to D1
  renderRecallPanel();
}

function handleRecallWithNote(file, remembered){
  handleRecall(file, remembered);
  // Suggest updating feynman note
  setTimeout(() => {
    if(confirm(remembered ? '记住了！要更新费曼笔记吗？' : '忘了...要更新费曼笔记标记未掌握的部分吗？')){
      openFeynmanModal(file, null);
    }
  }, 300);
}
function getDueRecallArticles(){
  const now = Date.now();
  const due = [];
  for(const [file, r] of Object.entries(recallData)){
    if(r.nextReview <= now){
      const article = DATA ? DATA.articles.find(a => a.file === file) : null;
      due.push({file, ...r, article});
    }
  }
  due.sort((a,b) => a.nextReview - b.nextReview);
  return due;
}
function getRecallStats(){
  const now = Date.now();
  let due=0, upcoming=0, mastered=0, total=0;
  for(const r of Object.values(recallData)){
    total++;
    if(r.nextReview <= now) due++;
    else if(r.nextReview <= now + 86400000) upcoming++;
    if(r.step >= RECALL_INTERVALS.length - 1) mastered++;
  }
  return {due, upcoming, mastered, total};
}
function renderRecallPanel(){
  if(!DATA) return;
  const stats = getRecallStats();
  const dueArticles = getDueRecallArticles();
  document.getElementById('recall-count-badge').textContent = stats.due + ' 待复习';
  document.getElementById('recall-toggle').textContent = recallPanelOpen ? '▼ 收起' : '▶ 展开';
  const panel = document.getElementById('recall-panel');
  panel.classList.toggle('open', recallPanelOpen);
  if(!recallPanelOpen) return;
  const statsEl = document.getElementById('recall-stats');
  statsEl.innerHTML =
    '<span>📝 总计: <b>'+stats.total+'</b></span>'+
    '<span>🔴 待复习: <b style="color:var(--red)">'+stats.due+'</b></span>'+
    '<span>🟡 明日到期: <b style="color:var(--yellow)">'+stats.upcoming+'</b></span>'+
    '<span>🟢 已稳定: <b style="color:var(--green)">'+stats.mastered+'</b></span>';
  const listEl = document.getElementById('recall-list');
  if(dueArticles.length === 0){
    listEl.innerHTML = '<div class="recall-empty">✅ 暂无到期复习内容，继续保持！</div>';
    return;
  }
  let html = '';
  dueArticles.forEach(item => {
    const title = item.article ? item.article.title : item.file;
    const chapter = item.article ? item.article.chapterName : '';
    const url = item.article ? articleUrl(item.article.file) : '#';
    const interval = RECALL_INTERVALS[item.step];
    const overdue = Date.now() - item.nextReview;
    const overdueH = Math.floor(overdue / 3600000);
    const escFile = item.file.replace(/'/g, "\\'");
    html += '<div class="recall-card">'+
      '<div class="recall-card-title"><a href="'+url+'" target="_blank" style="color:inherit;text-decoration:none">'+title+'</a></div>'+
      '<div class="recall-card-meta">'+
        '<span>'+chapter+'</span>'+
        '<span class="interval">间隔 '+interval+'d · 第'+(item.step+1)+'/'+RECALL_INTERVALS.length+' 轮</span>'+
        (overdue > 0 ? '<span class="due">超期 '+overdueH+'h</span>' : '')+
      '</div>'+
      '<div class="recall-actions">'+
        '<button class="recall-btn remembered" onclick="event.stopPropagation();handleRecallWithNote(\''+escFile+'\',true)">✓ 记住了</button>'+
        '<button class="recall-btn forgot" onclick="event.stopPropagation();handleRecallWithNote(\''+escFile+'\',false)">✗ 忘了</button>'+
        '<button class="recall-btn" onclick="event.stopPropagation();openFeynmanModal(\''+escFile+'\',null)" style="background:var(--surface2)">📝 笔记</button>'+
      '</div>'+
    '</div>';
  });
  listEl.innerHTML = html;
}


// ── Daily Article ─────────────────────────────────────────────
const DAILY_KEY = 'wiki-learn-daily-v1';

function getDailyArticle(){
  if(!DATA) return null;
  const stored = JSON.parse(localStorage.getItem(DAILY_KEY) || 'null');
  const today = new Date().toISOString().slice(0, 10);

  // Return cached if same day and article still unread
  if(stored && stored.date === today){
    const article = DATA.articles.find(a => a.file === stored.file);
    if(article && !getLevel(article.file)) return article;
  }

  // Pick new article: unread, deterministic by date
  const unread = DATA.articles.filter(a => !getLevel(a.file));
  if(unread.length === 0) return null;

  // Seed from date string for deterministic daily pick
  let hash = 0;
  for(let i = 0; i < today.length; i++) hash = ((hash << 5) - hash + today.charCodeAt(i)) | 0;
  const idx = Math.abs(hash) % unread.length;
  const picked = unread[idx];

  localStorage.setItem(DAILY_KEY, JSON.stringify({date: today, file: picked.file}));
  return picked;
}

function skipDailyArticle(){
  if(!DATA) return;
  const stored = JSON.parse(localStorage.getItem(DAILY_KEY) || 'null');
  const today = new Date().toISOString().slice(0, 10);
  // Get unread excluding current
  const unread = DATA.articles.filter(a => !getLevel(a.file) && (!stored || a.file !== stored.file));
  if(unread.length === 0){ renderDailyCard(); return; }
  let hash = 0;
  const seed = today + '-' + Date.now();
  for(let i = 0; i < seed.length; i++) hash = ((hash << 5) - hash + seed.charCodeAt(i)) | 0;
  const idx = Math.abs(hash) % unread.length;
  const picked = unread[idx];
  localStorage.setItem(DAILY_KEY, JSON.stringify({date: today, file: picked.file}));
  renderDailyCard();
}

function startDailyRead(phase, file){
  // Switch to the article's phase in the dashboard
  currentPhase = phase;
  // Update phase bar UI
  document.querySelectorAll('#phase-bar .phase-chip').forEach(c => {
    c.classList.toggle('active', parseInt(c.dataset.phase) === phase);
  });
  render();
  // Open the article in a new tab
  window.open(articleUrl(file), '_blank');
}

function renderDailyCard(){
  const section = document.getElementById('daily-section');
  if(!DATA){ section.style.display = 'none'; return; }
  const article = getDailyArticle();
  if(!article){
    section.innerHTML = '<div class="daily-card"><div class="daily-icon">🎉</div><div class="daily-body"><div class="daily-label">每日一读</div><div class="daily-title">全部文章已读完！太棒了 🏆</div></div></div>';
    return;
  }
  const url = articleUrl(article.file);
  const color = phaseColor(article.phase);
  const today = new Date();
  const dateStr = (today.getMonth()+1)+'/'+today.getDate();
  const lvClass = article.level===3?'lv3':article.level===2?'lv2':'lv1';

  document.getElementById('daily-title').innerHTML = '<a href="'+url+'" target="_blank" onclick="event.preventDefault();startDailyRead('+article.phase+',\''+article.file.replace(/'/g, "\\'")+'\')">'+article.title+'</a>';
  document.getElementById('daily-meta').innerHTML =
    '<span class="phase-tag" style="background:'+color+'">P'+article.phase+'</span>'+
    '<span>'+article.chapterName+'</span>'+
    '<span>'+formatWords(article.words)+'字</span>'+
    '<span class="level-badge '+lvClass+'">'+('⭐'.repeat(article.level))+'</span>';
  document.getElementById('daily-actions').innerHTML =
    '<button class="daily-read-btn" onclick="startDailyRead('+article.phase+',\''+article.file.replace(/'/g, "\\'")+'\')">📖 开始阅读</button>'+
    '<button class="daily-skip-btn" onclick="skipDailyArticle()">↻ 换一篇</button>';
  document.getElementById('daily-date').textContent = dateStr;
}


// ── Feynman Note System ───────────────────────────────────────
const FEYNMAN_KEY = 'wiki-learn-feynman-v1';
let feynmanData = JSON.parse(localStorage.getItem(FEYNMAN_KEY) || '{}');
let currentFeynmanFile = null;

function saveFeynmanStorage(){ localStorage.setItem(FEYNMAN_KEY, JSON.stringify(feynmanData)); }

function getFeynmanNote(file){ return feynmanData[file] || null; }

function openFeynmanModal(file, event){
  if(event) event.stopPropagation();
  currentFeynmanFile = file;
  const article = DATA ? DATA.articles.find(a => a.file === file) : null;
  const title = article ? article.title : file;
  const note = getFeynmanNote(file) || {};
  
  document.getElementById('feynman-article-title').textContent = title;
  document.getElementById('feynman-got').value = note.got || '';
  document.getElementById('feynman-missed').value = note.missed || '';
  document.getElementById('feynman-insight').value = note.insight || '';
  document.getElementById('feynman-next').value = note.next || '';
  document.getElementById('feynman-question').value = note.question || '';
  renderThreadsList(note.threads || []);
  
  // Show review history
  const reviewInfo = document.getElementById('feynman-review-info');
  if(note.updatedAt){
    const age = Date.now() - note.updatedAt;
    const ageDays = Math.floor(age / 86400000);
    const ageStr = ageDays === 0 ? '今天' : ageDays < 7 ? ageDays+'天前' : ageDays < 30 ? Math.floor(ageDays/7)+'周前' : Math.floor(ageDays/30)+'月前';
    const ageClass = ageDays > 30 ? 'old' : ageDays > 7 ? 'age' : '';
    reviewInfo.innerHTML = '<span class="count">复习 '+Math.max(1, note.reviews || 1)+' 次</span><br><span class="'+ageClass+'">上次: '+ageStr+'</span>';
  } else {
    reviewInfo.innerHTML = '<span style="color:var(--green)">首次记录</span>';
  }
  
  // Set level buttons
  const currentLevel = getLevel(file) || 'read';
  document.querySelectorAll('#feynman-level-row .feynman-level-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lv === currentLevel);
  });
  
  // Show upgrade hint if note is old and not mastered
  const upgradeHint = document.getElementById('feynman-upgrade-hint');
  if(note.updatedAt && currentLevel !== 'mastered'){
    const ageDays = Math.floor((Date.now() - note.updatedAt) / 86400000);
    const reviews = note.reviews || 1;
    if(ageDays > 7 || reviews >= 3){
      const nextLevel = currentLevel === 'read' ? '已解释' : currentLevel === 'explained' ? '教授' : '掌握';
      upgradeHint.innerHTML = '💡 复习 '+reviews+' 次了，考虑升级到 <span class="arrow">→ '+nextLevel+'</span>';
      upgradeHint.classList.add('show');
    } else {
      upgradeHint.classList.remove('show');
    }
  } else {
    upgradeHint.classList.remove('show');
  }
  
  document.getElementById('feynman-modal').classList.add('open');
}

function closeFeynmanModal(){
  document.getElementById('feynman-modal').classList.remove('open');
  currentFeynmanFile = null;
}

let currentThreads = [];

function renderThreadsList(threads){
  currentThreads = threads || [];
  const list = document.getElementById('feynman-threads-list');
  if(currentThreads.length === 0){
    list.innerHTML = '<div style="font-size:.75rem;color:var(--text3)">暂无关联对话</div>';
    return;
  }
  let html = '';
  currentThreads.forEach((t, i) => {
    html += '<div class="thread-item">'+
      '<span class="thread-name">'+(t.name || '未命名')+'</span>'+
      '<a href="'+t.url+'" target="_blank">'+t.url.slice(0, 40)+(t.url.length > 40 ? '...' : '')+'</a>'+
      '<span class="thread-remove" onclick="removeThread('+i+')">×</span>'+
    '</div>';
  });
  list.innerHTML = html;
}

function addThread(){
  const nameInput = document.getElementById('thread-name-input');
  const urlInput = document.getElementById('thread-url-input');
  const name = nameInput.value.trim();
  const url = urlInput.value.trim();
  if(!url) return;
  currentThreads.push({ name: name || url.slice(0, 30), url });
  renderThreadsList(currentThreads);
  nameInput.value = '';
  urlInput.value = '';
}

function removeThread(index){
  currentThreads.splice(index, 1);
  renderThreadsList(currentThreads);
}

function saveFeynmanNote(){
  if(!currentFeynmanFile) return;
  
  const level = document.querySelector('#feynman-level-row .feynman-level-btn.active')?.dataset.lv || 'read';
  const existing = getFeynmanNote(currentFeynmanFile) || {};
  const note = {
    level,
    got: document.getElementById('feynman-got').value.trim(),
    missed: document.getElementById('feynman-missed').value.trim(),
    insight: document.getElementById('feynman-insight').value.trim(),
    next: document.getElementById('feynman-next').value.trim(),
    question: document.getElementById('feynman-question').value.trim(),
    threads: currentThreads,
    updatedAt: Date.now(),
    reviews: (existing.reviews || 0) + 1
  };
  
  // Update level if changed
  if(level !== getLevel(currentFeynmanFile)){
    setLevel(currentFeynmanFile, level);
  }
  
  feynmanData[currentFeynmanFile] = note;
  saveFeynmanStorage();
  scheduleSync(); // Sync to D1
  closeFeynmanModal();
  render();
}

// Level button click opens feynman modal for read articles, cycles for unread
function handleLevelClick(file, event){
  event.stopPropagation();
  // Always cycle level, regardless of current state
  cycleLevel(file);
}

function feynmanSummary(file){
  const note = getFeynmanNote(file);
  if(!note) return '';
  const parts = [];
  if(note.got) parts.push('✓ ' + note.got.slice(0, 50));
  if(note.missed) parts.push('✗ ' + note.missed.slice(0, 50));
  if(note.insight) parts.push('💡 ' + note.insight.slice(0, 50));
  return parts.join(' · ');
}

  const target = new Date(countdownCfg.targetDate + 'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);

function renderPhaseBar(){
  const bar = document.getElementById('phase-bar');
  let html = `<div class="phase-chip active" data-phase="0" style="background:var(--surface2);color:var(--text)">全部</div>`;
  DATA.phases.forEach(p => {
    html += `<div class="phase-chip" data-phase="${p.id}" style="background:${p.color}33;color:${p.color}">${p.name.replace(/ · /,' ')}<span class="count">${p.count}</span></div>`;
  });
  bar.innerHTML = html;
  bar.querySelectorAll('.phase-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      bar.querySelectorAll('.phase-chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      currentPhase = parseInt(chip.dataset.phase);
      render();
    });
  });
}

// ── Chapter filters ───────────────────────────────────────────
function renderChapterFilters(){
  const div = document.getElementById('chapter-filters');
  let html = '<div class="chip active" data-ch="all">全部章节</div>';
  for(const [ch, name] of Object.entries(DATA.chapters)){
    const count = DATA.articles.filter(a=>a.chapter===ch).length;
    if(count > 0) html += `<div class="chip" data-ch="${ch}">${name.split(' ').pop()} (${count})</div>`;
  }
  div.innerHTML = html;
  div.querySelectorAll('.chip').forEach(c => {
    c.addEventListener('click', () => {
      div.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
      c.classList.add('active');
      currentChapter = c.dataset.ch;
      render();
    });
  });
}

// ── Level filters ─────────────────────────────────────────────
function renderLevelFilters(){
  const div = document.getElementById('level-filters');
  div.innerHTML = `
    <div class="chip active" data-lv="all">全部级别</div>
    <div class="chip" data-lv="3">⭐⭐⭐</div>
    <div class="chip" data-lv="2">⭐⭐</div>
    <div class="chip" data-lv="1">⭐</div>
  `;
  div.querySelectorAll('.chip').forEach(c => {
    c.addEventListener('click', () => {
      div.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
      c.classList.add('active');
      currentLevel = c.dataset.lv;
      render();
    });
  });
}

// ── Stats ─────────────────────────────────────────────────────
function renderStats(filtered){
  const allDone = Object.keys(done);
  const doneInFiltered = filtered.filter(a=>getLevel(a.file)).length;
  const totalWords = filtered.filter(a=>getLevel(a.file)).reduce((s,a)=>s+a.words,0);
  const readTime = (totalWords / 500 / 60).toFixed(1);

  const rStats = getRecallStats();
  const row = document.getElementById('stats-row');
  row.innerHTML = `
    <div class="stat"><div class="num" style="color:var(--green)">${allDone.length}</div><div class="label">已读总数</div></div>
    <div class="stat"><div class="num" style="color:var(--accent)">${doneInFiltered}/${filtered.length}</div><div class="label">当前视图</div></div>
    <div class="stat"><div class="num" style="color:var(--cyan)">${readTime}h</div><div class="label">已读时长</div></div>
    <div class="stat"><div class="num" style="color:var(--pink)">${rStats.due}</div><div class="label">待复习</div></div>
    <div class="stat"><div class="num" style="color:var(--orange)">${DATA.totalArticles}</div><div class="label">文章总数</div></div>
  `;
}

// ── Progress bars ─────────────────────────────────────────────
function renderProgress(){
  const div = document.getElementById('progress-bars');
  let html = '';
  DATA.phases.forEach(p => {
    const articles = DATA.articles.filter(a=>a.phase===p.id);
    const completed = articles.filter(a=>getLevel(a.file)).length;
    const mastered = articles.filter(a=>getLevel(a.file)==='mastered').length;
    const pct = articles.length ? Math.round(completed/articles.length*100) : 0;
    html += `<div class="phase-progress">
      <span class="pname" style="color:${p.color}">${p.name}</span>
      <div class="bar"><div class="bar-fill" style="width:${pct}%;background:${p.color}"></div></div>
      <span class="pcount">${completed}/${articles.length} 已读 · ${mastered} 掌握</span>
    </div>`;
  });
  div.innerHTML = html;
}

// ── Render cards ──────────────────────────────────────────────
function render(){
  if(!DATA) return;

  let filtered = DATA.articles;
  if(currentPhase > 0) filtered = filtered.filter(a=>a.phase===currentPhase);
  if(currentChapter !== 'all') filtered = filtered.filter(a=>a.chapter===currentChapter);
  if(currentLevel !== 'all') filtered = filtered.filter(a=>a.level===parseInt(currentLevel));
  if(searchQuery){
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(a =>
      a.title.toLowerCase().includes(q) || a.chapterName.toLowerCase().includes(q) || a.file.toLowerCase().includes(q)
    );
  }

  renderStats(filtered);
  renderProgress();
  renderRecallPanel();
  renderDailyCard();

  const content = document.getElementById('content');
  if(filtered.length === 0){
    content.innerHTML = '<div class="empty">🔍 没有匹配的文章</div>';
    return;
  }

  const groups = {};
  filtered.forEach(a => {
    const key = a.phase;
    if(!groups[key]) groups[key] = [];
    groups[key].push(a);
  });

  let html = '';
  const sortedPhases = Object.keys(groups).sort((a,b)=>a-b);

  sortedPhases.forEach(pid => {
    const articles = groups[pid];
    const p = DATA.phases.find(x=>x.id===parseInt(pid));
    const completed = articles.filter(a=>getLevel(a.file)).length;
    const color = phaseColor(parseInt(pid));

    html += `<div class="section-header">
      <h2 style="color:${color}">${phaseName(parseInt(pid))}</h2>
      <span class="badge">${completed}/${articles.length} 已读</span>
    </div>`;
    html += '<div class="grid">';

    articles.forEach(a => {
      const lv = getLevel(a.file);
      const isDone = lv !== null;
      const url = articleUrl(a.file);
      const lvClass = a.level===3?'lv3':a.level===2?'lv2':'lv1';
      const btnClass = lv || '';

      html += `<div class="card ${isDone?'done':''}">
        <div class="card-top">
          <span class="phase-badge" style="background:${color}">P${a.phase}</span>
          <span class="level-badge ${lvClass}">${'⭐'.repeat(a.level)}</span>
        </div>
        <div class="card-title"><a href="${url}" target="_blank">${a.title || a.file}</a></div>
        <div class="card-meta">
          <div>
            <span class="card-chapter">${a.chapterName}</span>
            <span class="card-words" style="margin-left:.5rem">${formatWords(a.words)}字</span>
          </div>
          <div class="card-actions">
            <button class="level-btn ${btnClass}" onclick="handleLevelClick('${a.file}',event)">${lv ? levelLabel(lv) : '○ 未读'}</button>
            ${lv ? (() => { 
              const fn = getFeynmanNote(a.file); 
              const hasThreads = fn?.threads?.length;
              const fileEsc = a.file.replace(/'/g, "\\'");
              const icon = fn ? (hasThreads ? '📝💬' : '📝✓') : '📝';
              return `<span class="feynman-badge" onclick="openFeynmanModal('${fileEsc}',event)">${icon}</span>`;
            })() : ''}
          </div>

        </div>
      </div>`;
    });

    html += '</div>';
  });

  content.innerHTML = html;
}

document.getElementById('recall-header').addEventListener('click', () => {
  recallPanelOpen = !recallPanelOpen;
  renderRecallPanel();
});

// ── Search ────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value;
  render();
});

// ── Sync UI ───────────────────────────────────────────────────
document.getElementById('user-id').addEventListener('change', e => {
  userId = e.target.value.trim();
  localStorage.setItem(USER_KEY, userId);
  if(userId){
    setSyncStatus('已连接: ' + userId, true);
    pullFromCloud();
  } else {
    setSyncStatus('离线模式（仅本地）', null);
  }
});

document.getElementById('sync-push').addEventListener('click', pushToCloud);
document.getElementById('sync-pull').addEventListener('click', pullFromCloud);

// ── Start ─────────────────────────────────────────────────────
init();
</script>

<div class="feynman-modal" id="feynman-modal">
  <div class="feynman-panel">
    <div class="feynman-header">
      <h3>🎓 费曼检验笔记</h3>
      <div class="feynman-review-info" id="feynman-review-info"></div>
      <button class="feynman-close" onclick="closeFeynmanModal()">×</button>
    </div>
    <div id="feynman-article-title" style="font-size:.9rem;color:var(--text2);margin-bottom:.8rem"></div>
    <div class="feynman-field">
      <label>真实水平</label>
      <div class="feynman-level-row" id="feynman-level-row">
        <button class="feynman-level-btn read" data-lv="read">📖 已读</button>
        <button class="feynman-level-btn explained" data-lv="explained">✍️ 已解释 🟡</button>
        <button class="feynman-level-btn taught" data-lv="taught">🎓 教授 🟠</button>
        <button class="feynman-level-btn mastered" data-lv="mastered">🏆 掌握 🟢</button>
      </div>
      <div class="feynman-upgrade-hint" id="feynman-upgrade-hint"></div>
    </div>
    <div class="feynman-field">
      <label>你拿到了什么概念？</label>
      <textarea id="feynman-got" placeholder="例如：L1/L2/L3 的结构和分配逻辑、execute_code 的"消解"本质..."></textarea>
    </div>
    <div class="feynman-field">
      <label>你没拿到什么？</label>
      <textarea id="feynman-missed" placeholder="例如：用类比讲给外行人听的能力、把五个点串成因果链..."></textarea>
    </div>
    <div class="feynman-field">
      <label>最大的认知收获</label>
      <textarea id="feynman-insight" placeholder="一句话概括你的顿悟时刻..."></textarea>
    </div>
    <div class="feynman-field">
      <label>下次要补什么？</label>
      <textarea id="feynman-next" placeholder="例如：给每个概念找一个日常类比，练习叙事弧..."></textarea>
    </div>
    <div class="feynman-field">
      <label>终局问题（可选）</label>
      <textarea id="feynman-question" placeholder="这篇文章引发你思考的更大问题..."></textarea>
    </div>
    <div class="feynman-field">
      <label>关联对话</label>
      <div id="feynman-threads-list" class="threads-list"></div>
      <div class="thread-add-row">
        <input type="text" id="thread-name-input" placeholder="Session 名称" class="thread-input" />
        <input type="text" id="thread-url-input" placeholder="codex://threads/xxx 或 URL" class="thread-input thread-url" />
        <button class="thread-add-btn" onclick="addThread()">+ 添加</button>
      </div>
    </div>
    <div class="feynman-actions">
      <button class="feynman-cancel" onclick="closeFeynmanModal()">取消</button>
      <button class="feynman-save" onclick="saveFeynmanNote()">保存笔记</button>
    </div>
  </div>
</div>
</body>
</html>
