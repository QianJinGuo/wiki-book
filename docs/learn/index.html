<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AI 工程主课程：从 LLM 到生产级 Agent">
  <title>AI 工程主课程 · 从 LLM 到生产级 Agent</title>
  <style>
    :root{--bg:#08111f;--panel:#101d31;--panel2:#15253d;--line:#29415f;--text:#e8f0fb;--muted:#91a4bd;--purple:#9b8afb;--cyan:#4fd1e8;--green:#45d483;--yellow:#f4c95d;--pink:#f38bbd;--shadow:0 18px 45px rgba(0,0,0,.2)}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(900px 500px at 8% -10%,rgba(99,102,241,.25),transparent 70%),var(--bg);color:var(--text);font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}a{color:inherit}button{font:inherit}
    .page{max-width:1440px;margin:0 auto;padding:28px 24px 64px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:30px}.brand{font-size:13px;color:var(--cyan);letter-spacing:.12em;font-weight:800}.top-links{display:flex;gap:12px;flex-wrap:wrap}.top-links a{font-size:13px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px}.top-links a:hover{color:var(--text);border-color:var(--purple)}
    .hero{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:24px;align-items:end;margin-bottom:24px}.hero h1{font-size:clamp(2rem,4vw,3.6rem);line-height:1.12;letter-spacing:-.05em;margin:8px 0 14px;background:linear-gradient(120deg,#fff,var(--purple) 55%,var(--cyan));-webkit-background-clip:text;color:transparent}.hero p{max-width:760px;color:var(--muted);font-size:16px;margin:0}.hero-stat{border:1px solid var(--line);background:rgba(16,29,49,.8);border-radius:14px;padding:16px;box-shadow:var(--shadow)}.hero-stat strong{display:block;color:var(--green);font-size:30px;line-height:1.1}.hero-stat span{color:var(--muted);font-size:13px}
    .project{border:1px solid rgba(79,209,232,.35);background:linear-gradient(120deg,rgba(17,67,88,.5),rgba(16,29,49,.85));border-radius:16px;padding:18px 20px;margin-bottom:24px;display:flex;gap:16px;align-items:center}.project-icon{font-size:30px}.project-copy{flex:1}.project-title{font-weight:800;color:var(--cyan);font-size:17px}.project-copy p{color:var(--muted);margin:2px 0 0;font-size:13px}.milestones{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.milestone{font-size:11px;color:#8de9f3;background:rgba(79,209,232,.1);border-radius:5px;padding:3px 6px}.milestone.done{color:#9af0bb;background:rgba(69,212,131,.14)}
    .layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:20px;align-items:start}.module-nav,.detail{border:1px solid var(--line);background:rgba(16,29,49,.78);border-radius:16px;box-shadow:var(--shadow)}.module-nav{padding:12px;position:sticky;top:18px}.nav-title{font-size:12px;color:var(--muted);letter-spacing:.08em;padding:6px 9px 10px}.module-item{width:100%;display:block;text-align:left;border:1px solid transparent;background:transparent;color:var(--text);border-radius:10px;padding:10px 11px;cursor:pointer;margin:4px 0}.module-item:hover{background:rgba(155,138,251,.08);border-color:rgba(155,138,251,.3)}.module-item.active{background:rgba(155,138,251,.13);border-color:var(--purple)}.module-line{display:flex;align-items:center;gap:7px}.module-order{color:var(--purple);font-size:12px;font-weight:800;min-width:29px}.module-part{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}.module-status{margin-left:auto;font-size:11px;color:var(--muted)}.module-status.current{color:var(--yellow)}.module-status.complete{color:var(--green)}.module-name{font-size:14px;font-weight:700;margin-top:5px;line-height:1.35}.module-meta{font-size:11px;color:var(--muted);margin-top:4px}
    .detail{padding:25px}.detail-kicker{color:var(--cyan);font-size:12px;letter-spacing:.1em;font-weight:800}.detail h2{font-size:clamp(1.5rem,3vw,2.35rem);line-height:1.2;margin:8px 0}.goal{color:var(--muted);max-width:850px;margin:0 0 14px}.prereq{font-size:12px;color:var(--muted);margin-bottom:18px}.overview-links{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}.overview-links a,.action{font-size:12px;border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:6px 9px;text-decoration:none;color:var(--muted);cursor:pointer}.overview-links a:hover,.action:hover{border-color:var(--purple);color:var(--text)}.section-title{font-size:13px;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid rgba(41,65,95,.7);padding-bottom:8px;margin:22px 0 8px}.lesson{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;padding:15px 0;border-bottom:1px solid rgba(41,65,95,.55);align-items:start}.lesson:last-child{border-bottom:0}.lesson-role{font-size:11px;color:var(--purple);padding-top:3px}.lesson h3{font-size:15px;line-height:1.4;margin:0 0 5px}.lesson h3 a{text-decoration:none}.lesson h3 a:hover{color:var(--cyan)}.essence{color:var(--muted);font-size:13px;line-height:1.55}.read-button{white-space:nowrap;border:1px solid var(--line);color:var(--muted);background:var(--panel2);border-radius:7px;padding:6px 9px;font-size:12px;cursor:pointer}.read-button:hover{border-color:var(--cyan);color:var(--text)}.read-button.done{color:var(--green);border-color:rgba(69,212,131,.6);background:rgba(69,212,131,.08)}
    .lab{margin-top:20px;background:rgba(155,138,251,.08);border:1px solid rgba(155,138,251,.28);border-radius:12px;padding:16px}.lab-title{color:var(--pink);font-weight:800;font-size:13px}.lab-brief{font-size:14px;margin:5px 0 12px}.checks{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.check{border:1px solid var(--line);background:rgba(8,17,31,.45);border-radius:7px;padding:6px 8px;color:var(--muted);font-size:12px;cursor:pointer}.check:hover{border-color:var(--purple);color:var(--text)}.check.done{border-color:rgba(69,212,131,.6);color:var(--green)}.check::before{content:"□ ";color:var(--muted)}.check.done::before{content:"✓ ";color:var(--green)}.action.primary{color:#fff;background:var(--purple);border-color:var(--purple)}.empty{padding:45px;text-align:center;color:var(--muted)}.error{color:#ff9d9d;border:1px solid #8f4450;background:rgba(143,68,80,.12);border-radius:10px;padding:16px}
    @media(max-width:880px){.hero{grid-template-columns:1fr}.hero-stat{max-width:230px}.layout{grid-template-columns:1fr}.module-nav{position:static}.module-nav-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px}.project{align-items:flex-start;flex-wrap:wrap}.milestones{justify-content:flex-start;margin-left:46px}}@media(max-width:560px){.page{padding:18px 14px 45px}.topbar{align-items:flex-start;flex-direction:column}.module-nav-list{grid-template-columns:1fr}.detail{padding:17px}.lesson{grid-template-columns:1fr}.lesson-role{padding:0}.read-button{justify-self:start}}
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar"><div class="brand">AI ENGINEERING · LEARNING SITE</div><div class="top-links"><a href="/">返回首页</a><a href="/dashboard/">进入原有知识 Dashboard</a></div></div>
    <section class="hero"><div><div class="brand">CURATED COURSE · 16 MODULES</div><h1>从 LLM 到生产级 Agent</h1><p>把 wiki 从“资料库”变成一条可完成的能力主线：每个模块只保留必要入口、一个动手任务和明确验收标准。</p></div><div class="hero-stat"><strong id="progress">0/16</strong><span>模块已完成</span></div></section>
    <section class="project"><div class="project-icon">🧪</div><div class="project-copy"><div class="project-title">贯穿项目：Wiki Research Agent</div><p>让 Agent 检索、阅读、交叉验证并引用本 wiki，最终交付可评估的研究报告。</p></div><div class="milestones" id="milestones"></div></section>
    <div id="app" class="empty">正在加载课程提炼结果…</div>
  </div>
  <script>
    const STORAGE_KEY = 'wiki-learn-course-progress-v2';
    let course = null;
    let progress = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    let selectedId = null;

    function escapeHtml(value){return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
    function stateOf(module){const value = progress[module.id] || {};return {read:value.read || {},lab:Boolean(value.lab),accepted:value.accepted || {}};}
    function moduleState(module){const state=stateOf(module);const read=module.lessons.filter(lesson=>state.read[lesson.file]).length;const accepted=module.lab.acceptance.filter((_,i)=>state.accepted[i]).length;return {state,read,accepted,complete:state.lab && accepted===module.lab.acceptance.length};}
    function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(progress));}
    function currentModule(){return course.modules.find(module=>module.id===selectedId) || course.modules[0];}
    function selectModule(id){selectedId=id;render();document.querySelector('.detail')?.scrollIntoView({behavior:'smooth',block:'start'});}
    function toggleRead(id,file){progress[id]=progress[id]||{};progress[id].read=progress[id].read||{};progress[id].read[file]=!progress[id].read[file];save();render();}
    function toggleLab(id){progress[id]=progress[id]||{};progress[id].lab=!progress[id].lab;save();render();}
    function toggleAcceptance(id,index){progress[id]=progress[id]||{};progress[id].accepted=progress[id].accepted||{};progress[id].accepted[index]=!progress[id].accepted[index];save();render();}
    function render(){
      if(!course)return;
      const states=course.modules.map(moduleState), complete=states.filter(value=>value.complete).length;
      document.getElementById('progress').textContent=`${complete}/${course.modules.length}`;
      const milestones=course.project?.milestones || [];
      const step=Math.max(1,Math.ceil(course.modules.length/milestones.length));
      document.getElementById('milestones').innerHTML=milestones.map((item,index)=>`<span class="milestone ${complete >= (index+1)*step ? 'done' : ''}">${escapeHtml(item)}</span>`).join('');
      if(!selectedId)selectedId=course.modules[states.findIndex(value=>!value.complete)]?.id || course.modules[0].id;
      const active=currentModule();
      document.getElementById('app').innerHTML=`<div class="layout"><aside class="module-nav"><div class="nav-title">课程模块 · 按顺序推进</div><div class="module-nav-list">${course.modules.map((module,index)=>{const value=moduleState(module);const activeClass=module.id===active.id?'active':'';const status=value.complete?'已完成':module.id===course.modules.find(item=>!moduleState(item).complete)?.id?'当前':'待开始';return `<button class="module-item ${activeClass}" data-action="select" data-module="${escapeHtml(module.id)}"><div class="module-line"><span class="module-order">M${String(index+1).padStart(2,'0')}</span><span class="module-part">${escapeHtml(module.part)}</span><span class="module-status ${status==='当前'?'current':status==='已完成'?'complete':''}">${status}</span></div><div class="module-name">${escapeHtml(module.title)}</div><div class="module-meta">${value.read}/${module.lessons.length} 篇入口 · ${value.accepted}/${module.lab.acceptance.length} 项验收</div></button>`;}).join('')}</div></aside><main class="detail">${renderDetail(active)}</main></div>`;
      bindActions();
    }
    function renderDetail(module){
      const value=moduleState(module), prerequisite=module.prerequisites?.length ? `前置模块：${module.prerequisites.join('、')}` : '这是课程起点';
      const lessons=module.lessons.map(lesson=>{const read=Boolean(value.state.read[lesson.file]);return `<article class="lesson"><div class="lesson-role">${escapeHtml(lesson.role)}</div><div><h3><a href="${escapeHtml(lesson.url)}" target="_blank" rel="noopener">${escapeHtml(lesson.title)}</a></h3><div class="essence">${escapeHtml(lesson.essence)}</div></div><button class="read-button ${read?'done':''}" data-action="read" data-module="${escapeHtml(module.id)}" data-file="${escapeHtml(lesson.file)}">${read?'✓ 已读':'标记已读'}</button></article>`;}).join('');
      const checks=module.lab.acceptance.map((item,index)=>`<button class="check ${value.state.accepted[index]?'done':''}" data-action="accept" data-module="${escapeHtml(module.id)}" data-index="${index}">${escapeHtml(item)}</button>`).join('');
      const overview=(module.chapterOverviews||[]).map(item=>`<a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">读${escapeHtml(item.title)}导读</a>`).join('');
      return `<div class="detail-kicker">M${String(module.order).padStart(2,'0')} · ${escapeHtml(module.part)}</div><h2>${escapeHtml(module.title)}</h2><p class="goal">${escapeHtml(module.goal)}</p><div class="prereq">${escapeHtml(prerequisite)}</div><div class="overview-links">${overview}</div><div class="section-title">精选入口 · ${value.read}/${module.lessons.length} 已读</div>${lessons}<div class="lab"><div class="lab-title">🛠 ${escapeHtml(module.lab.title)}</div><div class="lab-brief">${escapeHtml(module.lab.brief)}</div><div class="checks">${checks}</div><button class="action primary" data-action="lab" data-module="${escapeHtml(module.id)}">${value.state.lab?'✓ 已完成动手任务':'标记动手任务完成'}</button></div>`;
    }
    function bindActions(){document.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>{const action=button.dataset.action;if(action==='select')selectModule(button.dataset.module);if(action==='read')toggleRead(button.dataset.module,button.dataset.file);if(action==='lab')toggleLab(button.dataset.module);if(action==='accept')toggleAcceptance(button.dataset.module,Number(button.dataset.index));}));}
    async function init(){try{const response=await fetch('./course.json',{cache:'no-store'});if(!response.ok)throw new Error(`course.json ${response.status}`);course=await response.json();render();}catch(error){document.getElementById('app').innerHTML=`<div class="error">课程数据加载失败：${escapeHtml(error.message)}</div>`;}}
    init();
  </script>
</body>
</html>
