        - article [ref=f8e96]:
          - heading [level=1] [ref=f8e97]:
            - text: Introducing OS Level Actions in Amazon Bedrock AgentCore Browser
            - link "¶" [ref=f8e98] [cursor=pointer]:
              - /url: "#introducing-os-level-actions-in-amazon-bedrock-agentcore-browser"
          - blockquote [ref=f8e99]:
            - paragraph [ref=f8e100]:
              - text: 📊 Level ⭐ | 7.7KB |
              - code [ref=f8e101]: entities/introducing-os-level-actions-in-amazon-bedrock-agentcore-browser.md
            - paragraph [ref=f8e102]:
              - text: "->"
              - link "原文存档" [ref=f8e103] [cursor=pointer]:
                - /url: https://aws.amazon.com/blogs/machine-learning/introducing-os-level-actions-in-amazon-bedrock-agentcore-browser/
          - heading [level=2] [ref=f8e104]:
            - text: 摘要
            - link "¶" [ref=f8e105] [cursor=pointer]:
              - /url: "#_1"
          - paragraph [ref=f8e106]: "AI agents that automate web workflows operate within the browser’s web layer, the DOM that Playwright and the Chrome DevTools Protocol (CDP) expose. AgentCore Browser provides a secure, isolated browser environment for this, and it works well for the vast majority of automation: navigating pages,..."
          - heading [level=2] [ref=f8e107]:
            - text: 深度分析
            - link "¶" [ref=f8e108] [cursor=pointer]:
              - /url: "#_2"
          - paragraph [ref=f8e109]:
            - text: OS Level Actions 的发布标志着
            - strong [ref=f8e110]: 浏览器自动化能力的最后一次关键补全
            - text: 。在 AgentCore Browser 之前，浏览器自动化经历了三个阶段：DOM 操作（Playwright/CDP）→ 视觉理解（Vision Model）→ OS 层交互（现在）。
            - strong [ref=f8e111]: 核心突破
            - text: ：原生操作系统 UI（对话框、安全提示、证书选择器、右键菜单）是 DOM 层无法触及的"盲区"。OS Level Actions 通过
            - code [ref=f8e112]: InvokeBrowser
            - text: API 将控制力延伸到这个盲区，形成了
            - strong [ref=f8e113]: 完整的 Action-Screenshot-Reaction 闭环
            - text: 。
            - strong [ref=f8e114]: 架构设计的关键选择
            - text: ： 1.
            - strong [ref=f8e115]: 无额外设置
            - text: ：所有操作通过现有的
            - code [ref=f8e116]: InvokeBrowser
            - text: API 暴露，这意味着已有 AgentCore Browser 集成的系统可以零成本获得 OS 层能力。 2.
            - strong [ref=f8e117]: 全桌面截图
            - text: ：与 DOM 截图不同，OS 截图捕获整个屏幕，包括原生 UI 元素。这是 Vision Model 能够"看见"对话框的前提。 3.
            - strong [ref=f8e118]: 单 Action 模式
            - text: ：每次调用只执行一个 Action（click/move/type），这符合 Agent 的决策-执行循环设计原则，降低了状态复杂度。
            - strong [ref=f8e119]: 竞争格局
            - text: ：传统 RPA（UiPath、Automation Anywhere）依赖本地安装的 Agent，需要处理复杂的兼容性问题。AgentCore Browser 的云托管 + OS Actions 组合提供了一个纯云端的替代方案。
          - heading [level=2] [ref=f8e120]:
            - text: 实践启示
            - link "¶" [ref=f8e121] [cursor=pointer]:
              - /url: "#_3"
          - list [ref=f8e122]:
            - listitem [ref=f8e123]:
              - strong [ref=f8e124]: 处理生产环境中的边缘场景
              - text: ：当你的 Agent 遇到
              - code [ref=f8e125]: window.print()
              - text: 触发的系统打印对话框、
              - code [ref=f8e126]: window.showModalDialog()
              - text: 、或 macOS 隐私对话框时，OS Level Actions 是唯一可靠的自动化手段。
            - listitem [ref=f8e127]:
              - strong [ref=f8e128]: 右击上下文菜单的自动化
              - text: ：需要通过右键菜单执行操作时，使用
              - code [ref=f8e129]: mouseClick
              - text: +
              - code [ref=f8e130]: "button: \"RIGHT\""
              - text: 组合。
            - listitem [ref=f8e131]:
              - strong [ref=f8e132]: 快捷键编排
              - text: ：对于需要
              - code [ref=f8e133]: Ctrl+A
              - text: （全选）、
              - code [ref=f8e134]: Ctrl+C
              - text: （复制）等组合键的操作，
              - code [ref=f8e135]: keyShortcut
              - text: action 支持最多 5 个键的组合。
            - listitem [ref=f8e136]:
              - strong [ref=f8e137]: 截图观察循环
              - text: ：每次 OS Action 后都要截图确认状态变化。这不是"可选的调试步骤"，而是 Agent 决策循环的必要组成部分。
            - listitem [ref=f8e138]:
              - strong [ref=f8e139]: 坐标系统的理解
              - text: ：所有坐标基于 session 的
              - code [ref=f8e140]: viewPort
              - text: 设置。如果 viewport 是 1920×1080，x 有效范围是 0-1919，y 是 0-1079。超出范围的坐标会触发
              - code [ref=f8e141]: ValidationException
              - text: 。
