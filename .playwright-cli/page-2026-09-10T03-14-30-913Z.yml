            - link "¶" [ref=f7e99] [cursor=pointer]:
              - /url: "#_1"
          - paragraph [ref=f7e100]: 本课程从 wiki 的 5,000+ 篇当前文章中，为每个模块挑选 3 篇入口材料：
          - list [ref=f7e101]:
            - listitem [ref=f7e102]: 核心原理：建立概念模型。
            - listitem [ref=f7e103]: 工程案例：观察真实系统如何取舍。
            - listitem [ref=f7e104]: 延伸阅读：把概念放进更大的技术谱系。
          - paragraph [ref=f7e105]:
            - text: 每个模块都有一个动手任务和验收标准。16 个模块共用一个毕业项目：
            - strong [ref=f7e106]: Wiki Research Agent
            - text: 。它会逐步获得检索、工具调用、记忆、评测、引用和部署能力。
