          - list [ref=f7e146]:
            - listitem [ref=f7e147]: 每周完成 1 个模块，不追求一天刷完几十篇文章。
            - listitem [ref=f7e148]: 入口文章只做建模；遇到项目中的具体问题，再回到资料库深挖。
            - listitem [ref=f7e149]: 每篇入口文章读完后，至少留下一个判断、一个反例或一段代码。
            - listitem [ref=f7e150]: 进入下一个模块前，先完成当前模块的动手任务和验收标准。
