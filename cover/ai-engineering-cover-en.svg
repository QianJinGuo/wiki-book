<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1600" height="2400" viewBox="0 0 1600 2400" role="img"
     aria-labelledby="title desc">
  <title id="title">AI Engineering open-source book cover</title>
  <desc id="desc">From LLM fundamentals to production-grade agents.</desc>

  <defs>
    <linearGradient id="leftShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050f1f" stop-opacity="0.88"/>
      <stop offset="0.62" stop-color="#071426" stop-opacity="0.57"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="bottomShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071426" stop-opacity="0"/>
      <stop offset="1" stop-color="#040b18" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5c84c"/>
      <stop offset="1" stop-color="#f5c84c" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sans { font-family: "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", "JetBrains Mono", "Menlo", monospace; }
      .eyebrow { font-size: 28px; letter-spacing: 7px; font-weight: 600; }
      .micro { font-size: 24px; letter-spacing: 3px; }
      .meta { font-size: 26px; letter-spacing: 2px; }
    </style>
  </defs>

  <rect width="1600" height="2400" fill="#0a1628"/>
  <image x="0" y="0" width="1600" height="2400"
         preserveAspectRatio="xMidYMid slice"
         href="art/portrait-art-gold.png" xlink:href="art/portrait-art-gold.png"/>
  <rect width="1600" height="2400" fill="url(#leftShade)"/>
  <rect width="1600" height="2400" fill="url(#bottomShade)"/>

  <circle cx="150" cy="196" r="6" fill="#f5c84c"/>
  <text x="180" y="207" class="sans eyebrow" fill="#f0e9d9">AI ENGINEERING</text>
  <text x="180" y="258" class="mono micro" fill="#c9a84c">KNOWLEDGE SYSTEMS / 01</text>

  <rect x="150" y="390" width="8" height="300" rx="4" fill="#f5c84c"/>
  <rect x="176" y="388" width="900" height="2" fill="url(#goldLine)"/>

  <text x="176" y="590" class="sans" font-size="124" font-weight="800" letter-spacing="1" fill="#f7f2e4">
    <tspan fill="#f5c84c">AI</tspan><tspan fill="#f7f2e4"> ENGINEERING</tspan>
  </text>
  <text x="180" y="735" class="sans" font-size="50" font-weight="400" fill="#efe8d6">From LLM Fundamentals to</text>
  <text x="180" y="820" class="sans" font-size="64" font-weight="600" fill="#efe8d6">Production-Grade Agents</text>

  <rect x="180" y="895" width="620" height="2" fill="#c9a84c" opacity="0.78"/>
  <text x="180" y="965" class="sans meta" fill="#e0d8c2">20 CHAPTERS · 5 PARTS · TRACEABLE SOURCES</text>
  <text x="180" y="1020" class="mono micro" fill="#a99f87">LLM  /  AGENT  /  HARNESS  /  MCP  /  RAG</text>

  <text x="180" y="1185" class="sans" font-size="31" font-weight="600" letter-spacing="4" fill="#f5c84c">FIVE-PART LEARNING PATH</text>
  <rect x="180" y="1225" width="3" height="375" fill="#c9a84c" opacity="0.52"/>

  <circle cx="181" cy="1285" r="6" fill="#f5c84c"/>
  <text x="220" y="1293" class="mono" font-size="24" fill="#c9a84c">01</text>
  <text x="320" y="1293" class="sans" font-size="32" font-weight="600" fill="#efe8d6">FOUNDATIONS</text>
  <text x="650" y="1293" class="sans" font-size="24" fill="#b5ac96">Understand AI from first principles</text>

  <circle cx="181" cy="1358" r="6" fill="#f5c84c"/>
  <text x="220" y="1366" class="mono" font-size="24" fill="#c9a84c">02</text>
  <text x="320" y="1366" class="sans" font-size="32" font-weight="600" fill="#efe8d6">ENGINEER</text>
  <text x="650" y="1366" class="sans" font-size="24" fill="#b5ac96">Build reliable AI applications</text>

  <circle cx="181" cy="1431" r="6" fill="#f5c84c"/>
  <text x="220" y="1439" class="mono" font-size="24" fill="#c9a84c">03</text>
  <text x="320" y="1439" class="sans" font-size="32" font-weight="600" fill="#efe8d6">EXPERT</text>
  <text x="650" y="1439" class="sans" font-size="24" fill="#b5ac96">Design systems and architecture</text>

  <circle cx="181" cy="1504" r="6" fill="#f5c84c"/>
  <text x="220" y="1512" class="mono" font-size="24" fill="#c9a84c">04</text>
  <text x="320" y="1512" class="sans" font-size="32" font-weight="600" fill="#efe8d6">SCIENTIST</text>
  <text x="650" y="1512" class="sans" font-size="24" fill="#b5ac96">Research and innovate</text>

  <circle cx="181" cy="1577" r="6" fill="#f5c84c"/>
  <text x="220" y="1585" class="mono" font-size="24" fill="#c9a84c">05</text>
  <text x="320" y="1585" class="sans" font-size="32" font-weight="600" fill="#efe8d6">MASTERY</text>
  <text x="650" y="1585" class="sans" font-size="24" fill="#b5ac96">Safety, philosophy, and the future</text>

  <text x="180" y="2160" class="sans" font-size="36" font-weight="500" fill="#f0e9d9">QianJinGuo</text>
  <text x="1420" y="2160" class="mono meta" text-anchor="end" fill="#a99f87">v1.3.8</text>
  <rect x="180" y="2200" width="1240" height="1" fill="#e4dcc8" opacity="0.24"/>
  <text x="180" y="2265" class="mono micro" fill="#a99f87">OPEN SOURCE  ·  CC BY-SA 4.0</text>
  <text x="1420" y="2265" class="mono micro" text-anchor="end" fill="#a99f87">JINGUO.TECH</text>
</svg>
