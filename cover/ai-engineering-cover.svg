<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1600" height="2400" viewBox="0 0 1600 2400" role="img"
     aria-labelledby="title desc">
  <title id="title">《AI 工程》电子书封面</title>
  <desc id="desc">从 LLM 原理到生产级 Agent 的 AI 工程学术读物封面。</desc>

  <defs>
    <linearGradient id="leftShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#061224" stop-opacity="0.88"/>
      <stop offset="0.62" stop-color="#071426" stop-opacity="0.57"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="bottomShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071426" stop-opacity="0"/>
      <stop offset="1" stop-color="#040b18" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5c84c"/>
      <stop offset="1" stop-color="#f5c84c" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sans { font-family: "PingFang SC", "Hiragino Sans", "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", "JetBrains Mono", "Menlo", monospace; }
      .eyebrow { font-size: 28px; letter-spacing: 7px; font-weight: 600; }
      .micro { font-size: 24px; letter-spacing: 3px; }
      .meta { font-size: 26px; letter-spacing: 2px; }
    </style>
  </defs>

  <rect width="1600" height="2400" fill="#071426"/>
  <image x="0" y="0" width="1600" height="2400"
         preserveAspectRatio="xMidYMid slice"
         href="art/portrait-art.png" xlink:href="art/portrait-art.png"/>
  <rect width="1600" height="2400" fill="url(#leftShade)"/>
  <rect width="1600" height="2400" fill="url(#bottomShade)"/>

  <!-- Quiet editorial marker and title block. -->
  <circle cx="150" cy="196" r="6" fill="#f5c84c"/>
  <text x="180" y="207" class="sans eyebrow" fill="#dceaf4">AI ENGINEERING</text>
  <text x="180" y="258" class="mono micro" fill="#62c9ed">KNOWLEDGE SYSTEMS / 01</text>

  <rect x="150" y="390" width="8" height="300" rx="4" fill="#f5c84c"/>
  <rect x="176" y="388" width="510" height="2" fill="url(#goldLine)"/>

  <text x="176" y="610" class="sans" font-size="206" font-weight="800" letter-spacing="-4"
        fill="#f8fbff">
    <tspan fill="#f5c84c">AI</tspan><tspan fill="#f8fbff"> 工程</tspan>
  </text>
  <text x="180" y="745" class="sans" font-size="58" font-weight="400" fill="#f2f6fa">
    从 LLM 原理到生产级
  </text>
  <text x="180" y="820" class="sans" font-size="72" font-weight="600" fill="#f2f6fa">
    Agent
  </text>

  <rect x="180" y="895" width="420" height="2" fill="#62c9ed" opacity="0.78"/>
  <text x="180" y="965" class="sans meta" fill="#d8e4ee">20 章 · 5 篇 · 4,000+ 一手文章</text>
  <text x="180" y="1020" class="mono micro" fill="#8db4c8">LLM  /  AGENT  /  HARNESS  /  MCP  /  RAG</text>

  <!-- A compact overview makes the scope legible without turning the cover into a table of contents. -->
  <text x="180" y="1185" class="sans" font-size="31" font-weight="600" letter-spacing="4" fill="#f5c84c">全书五篇</text>
  <rect x="180" y="1225" width="3" height="375" fill="#62c9ed" opacity="0.52"/>

  <circle cx="181" cy="1285" r="6" fill="#f5c84c"/>
  <text x="220" y="1293" class="mono" font-size="24" fill="#62c9ed">01</text>
  <text x="310" y="1293" class="sans" font-size="33" font-weight="600" fill="#f2f6fa">入门篇</text>
  <text x="520" y="1293" class="sans" font-size="25" fill="#b6d0dd">从零理解 AI</text>

  <circle cx="181" cy="1358" r="6" fill="#f5c84c"/>
  <text x="220" y="1366" class="mono" font-size="24" fill="#62c9ed">02</text>
  <text x="310" y="1366" class="sans" font-size="33" font-weight="600" fill="#f2f6fa">工程师篇</text>
  <text x="520" y="1366" class="sans" font-size="25" fill="#b6d0dd">构建 AI 应用</text>

  <circle cx="181" cy="1431" r="6" fill="#f5c84c"/>
  <text x="220" y="1439" class="mono" font-size="24" fill="#62c9ed">03</text>
  <text x="310" y="1439" class="sans" font-size="33" font-weight="600" fill="#f2f6fa">专家篇</text>
  <text x="520" y="1439" class="sans" font-size="25" fill="#b6d0dd">深入系统架构</text>

  <circle cx="181" cy="1504" r="6" fill="#f5c84c"/>
  <text x="220" y="1512" class="mono" font-size="24" fill="#62c9ed">04</text>
  <text x="310" y="1512" class="sans" font-size="33" font-weight="600" fill="#f2f6fa">科学家篇</text>
  <text x="520" y="1512" class="sans" font-size="25" fill="#b6d0dd">研究与创新</text>

  <circle cx="181" cy="1577" r="6" fill="#f5c84c"/>
  <text x="220" y="1585" class="mono" font-size="24" fill="#62c9ed">05</text>
  <text x="310" y="1585" class="sans" font-size="33" font-weight="600" fill="#f2f6fa">大师篇</text>
  <text x="520" y="1585" class="sans" font-size="25" fill="#b6d0dd">哲学、安全与未来</text>

  <!-- Publisher-safe lower region: deliberately clear of marks and logos. -->
  <text x="180" y="2160" class="sans" font-size="36" font-weight="500" fill="#f1f6fa">QianJinGuo</text>
  <text x="1420" y="2160" class="mono meta" text-anchor="end" fill="#a8c3d2">v1.3.8</text>
  <rect x="180" y="2200" width="1240" height="1" fill="#dceaf4" opacity="0.24"/>
  <text x="180" y="2265" class="mono micro" fill="#a8c3d2">OPEN SOURCE  ·  CC BY-SA 4.0</text>
  <text x="1420" y="2265" class="mono micro" text-anchor="end" fill="#a8c3d2">JINGUO.TECH</text>
</svg>
